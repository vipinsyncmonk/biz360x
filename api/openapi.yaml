          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        subject:
          type: string
        subject_id:
          type: string
          format: uuid
        data:
          type: object
      required:
      - id
      - type
      - entity_id
      - occurred_at
    WebhookEndpoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
          examples:
          - - obligation.filed
            - sales_document.paid
        secret:
          type: string
          readOnly: true
          description: Shown once; used for the HMAC signature
        is_active:
          type: boolean
      required:
      - url
      - events
