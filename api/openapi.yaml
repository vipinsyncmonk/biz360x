            - due
            - client
            - overdue
            - na
          examples:
          - MCA: client
            GST: due
            TDS: client
            EPFO_ESIC: due
            INCOME_TAX: clear
        open_items:
          type: array
          items:
            $ref: '#/components/schemas/OpenItem'
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
        plan:
          type: string
        entity_count:
          type: integer
    EntityStandingPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EntityStanding'
        next_cursor:
          oneOf:
          - type: string
          - type: 'null'
      required:
      - data
      - next_cursor
    StaffLoad:
      type: object
      properties:
