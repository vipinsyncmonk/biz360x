openapi: 3.1.0
info:
  title: Biz360X API
  version: 1.0.0
  summary: Business OS for Indian companies, startups and MSMEs — compliance engine, books, GST, payroll, billing.
  description: 'All business data lives under an **entity** (a legal entity: company, LLP, firm). Every entity-scoped path
    starts with `/entities/{entityId}`. The server sets the caller on the database session and PostgreSQL row-level security
    decides visibility, so an entity the caller cannot see returns **404**, never 403.


    **Money** is a decimal string in INR with two places (`"472000.00"`). **Dates** are `YYYY-MM-DD`, moments are RFC 3339
    UTC.


    **Writes that move money or file with a government portal** require `Idempotency-Key`. Operations that call GSTN, IRP,
    MCA, TRACES, EPFO or ESIC return `202 Accepted` with a `Job`; follow it at `/jobs/{jobId}`, on the `/events` stream, or
    by webhook.


    **Errors** are `application/problem+json` (RFC 9457) with a stable `code`.


    Each operation lists the permission it needs in `x-permission` (`module:action`).'
  contact:
    name: Biz360X
    email: '[API CONTACT EMAIL]'
servers:
- url: https://api.[YOUR DOMAIN]/v1
  description: Production (data stays in India)
- url: https://sandbox.api.[YOUR DOMAIN]/v1
  description: Sandbox — portal calls hit GSP/IRP sandboxes
security:
- bearerAuth: []
tags:
- name: Auth
  description: Sign-in. Email + password, mobile OTP, Google/Microsoft OIDC, or SAML SSO. Tokens are JWTs.
- name: Me
  description: The signed-in user, their entities and preferences
- name: Onboarding
  description: Look an identifier up in public registries and turn it into a workspace and an obligation graph
- name: Entities
  description: Legal entities, their registrations, members, advisors and facts
- name: Compliance
  description: Rules, obligations, calendar, thresholds and notices
- name: Approvals
  description: Maker–checker approvals, e-sign / DSC signature requests, and tasks
- name: Parties & items
  description: Customers, vendors and the item catalogue
- name: Sales & billing
  description: Quotes, orders, invoices, credit/debit notes, e-invoice, e-way bills, payment links, receipts, dunning
- name: Public pay
  description: The customer-facing payment page. No authentication; rate-limited; exposes only what is printed on the invoice.
- name: Purchases
  description: Purchase orders, bills (with the MSMED 45-day clock) and vendor payments
- name: GST & tax
  description: GST returns, 2A/2B matching, credit ledger, TDS, challans, advance tax, ITR
- name: Finance & books
  description: Chart of accounts, journals, periods, banking, reconciliation, close and reports
- name: Payroll & HR
  description: Employees, salary structures, payroll runs, payslips, labour-law checks
- name: Legal & board
  description: Contracts, extracted terms, templates, meetings and resolutions
- name: Capital
  description: Cap table, share classes and holders, funding rounds, allotments and ESOPs
- name: Schemes & credit
  description: Government schemes and benefits, TReDS, delayed-payment claims
- name: Documents
  description: Vault uploads, search, links, advisor requests and data rooms
- name: Export & import
  description: Shipping bills and the realisation of export proceeds, bills of entry and the duty paid on them, the LUT, RoDTEP
    and drawback claims. A person records what customs and the bank issued; nothing calls ICEGATE, DGFT or a bank. Proceeds
    recorded with the rupees the bank credited settle the export invoice and post the foreign exchange gain or loss.
- name: Portals & jobs
  description: Government / bank connections, OTP sessions, sync jobs and the job resource
- name: Copilot
  description: Questions answered from the entity's own records, with citations; actions always go through approval
- name: Organizations
  description: Organisation-level views for business groups and CA / CS firms
- name: Events & webhooks
  description: Server-sent events for the UI and signed webhooks for integrations
- name: API keys
  description: Server-to-server keys. A key acts as a named service user, limited to the permissions listed on it. It can
    never approve, file or pay.
- name: Audit
  description: Append-only, hash-chained audit trail
paths:
  /auth/otp:
    post:
      tags:
      - Auth
      operationId: requestOtp
      summary: Send a one-time code
      description: Rate-limited to 5 per hour per identifier. The answer is the same whether or not the person exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
        '409':
          $ref: '#/components/responses/Conflict'
      security: []
  /auth/signup:
    post:
      tags:
      - Auth
      operationId: signUp
      summary: Create an account and send a one-time code
      description: Same answer whether or not the address is registered; an existing person's name is not changed. 5 per minute
        per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
        '409':
          $ref: '#/components/responses/Conflict'
      security: []
  /auth/token:
    post:
      tags:
      - Auth
      operationId: issueToken
      summary: Exchange credentials, an OTP or a refresh token for tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
        '409':
          $ref: '#/components/responses/Conflict'
      security: []
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: Revoke the refresh token and its whole session family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
        '409':
          $ref: '#/components/responses/Conflict'
  /me:
    get:
      tags:
      - Me
      operationId: getMe
      summary: Who am I, and which entities can I act on
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
  /me/notification-preferences:
    get:
      tags:
      - Me
      operationId: listNotificationPreferences
      summary: My notification matrix
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
    put:
      tags:
      - Me
      operationId: replaceNotificationPreferences
      summary: Replace my notification matrix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NotificationPreference'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
  /onboarding/lookups:
    post:
      tags:
      - Onboarding
      operationId: createRegistryLookup
      summary: Look up a CIN, LLPIN, GSTIN or PAN
      description: Synchronous when cached (≈ 4 s); otherwise poll `GET /onboarding/lookups/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryLookup'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryLookup'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
        '409':
          $ref: '#/components/responses/Conflict'
  /onboarding/lookups/{id}:
    get:
      tags:
      - Onboarding
      operationId: getRegistryLookup
      summary: Get a lookup
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryLookup'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
  /onboarding/preview:
    post:
      tags:
      - Onboarding
      operationId: previewObligations
      summary: Preview the obligation graph for a set of answers (no writes)
      description: Powers the live count while the user answers questions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingAnswers'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObligationPreview'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
        '409':
          $ref: '#/components/responses/Conflict'
  /onboarding/workspaces:
    post:
      tags:
      - Onboarding
      operationId: createWorkspace
      summary: Create the entity, registrations, facts and first engine run
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingAnswers'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceCreated'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
        '409':
          $ref: '#/components/responses/Conflict'
  /entities/{entityId}:
    get:
      tags:
      - Entities
      operationId: getEntity
      summary: Get the entity
      parameters:
      - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
      x-permission: settings:read
    patch:
      tags:
      - Entities
      operationId: updateEntity
      summary: Update the entity
      parameters:
      - $ref: '#/components/parameters/EntityId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Entity'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
      x-permission: settings:write
  /entities/{entityId}/registrations:
    get:
      tags:
      - Entities
      operationId: listRegistrations
      summary: List registrations
      parameters:
      - $ref: '#/components/parameters/EntityId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Sort'
      - name: kind
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
      x-permission: settings:read
    post:
      tags:
      - Entities
      operationId: createRegistration
      summary: Create registration
      parameters:
      - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permission: settings:write
  /entities/{entityId}/registrations/{id}:
    get:
      tags:
      - Entities
      operationId: getRegistration
      summary: Get registration
      parameters:
      - $ref: '#/components/parameters/EntityId'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
      x-permission: settings:read
    patch:
      tags:
      - Entities
      operationId: updateRegistration
      summary: Update registration
      description: JSON merge patch (RFC 7396). Read-only fields are ignored.
      parameters:
      - $ref: '#/components/parameters/EntityId'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
      x-permission: settings:write
  /entities/{entityId}/members:
    get:
      tags:
      - Entities
      operationId: listMembers
      summary: List members
      parameters:
      - $ref: '#/components/parameters/EntityId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Sort'
