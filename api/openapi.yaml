webhooks:
  obligation.created:
    post:
      summary: Engine switched on a new obligation
      operationId: webhook_obligation_created
      parameters:
      - name: Biz360X-Signature
        in: header
        required: true
        schema:
          type: string
          examples:
          - t=1793840000,v1=5257a869e7…
        description: HMAC-SHA256 of `t.body` with the endpoint secret. Reject if |now − t| > 300 s.
      - name: Biz360X-Event-Id
        in: header
        required: true
        schema:
          type: string
        description: Deduplicate on this
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        2XX:
          description: Acknowledged. Non-2xx is retried with backoff for 72 h.
  obligation.due_soon:
    post:
      summary: An obligation is 7 days / 1 day from due
      operationId: webhook_obligation_due_soon
      parameters:
      - name: Biz360X-Signature
        in: header
