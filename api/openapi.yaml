      summary: List advisor grants
      parameters:
      - $ref: '#/components/parameters/EntityId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisorGrantPage'
        '400':
