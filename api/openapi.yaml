  /entities/{entityId}/einvoice-status:
    get:
      tags:
      - Sales & billing
      operationId: getEInvoiceStatus
      summary: Whether e-invoicing applies and the turnover it rests on
      description: E-invoicing starts in the financial year after the first year in which aggregate turnover went above ₹5
        Cr, and stays on. A year's figure is the one declared as an `aato` fact dated in it (`POST /facts`, for example dated
        31 March), else the taxable value of the documents issued in it, less credit notes. `level` is `approaching` from
        80% of the limit in the current year and `crossed` once it has gone over, before it applies.
      parameters:
      - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: OK
          content:
