          oneOf:
          - type: integer
          - type: 'null'
        error:
          oneOf:
          - type: string
          - type: 'null'
        attempted_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        delivered_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        next_retry_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
      readOnly: true
    WebhookDeliveryPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        next_cursor:
          oneOf:
          - type: string
          - type: 'null'
      required:
      - data
      - next_cursor
    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        prefix:
          type: string
          readOnly: true
          examples:
          - bzx_live_ab12cd34
        permissions:
          type: array
          items:
            type: string
            pattern: ^[a-z_]+:(read|write|use)$
          examples:
          - - sales:read
            - sales:write
        expires_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        last_used_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        revoked_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        created_at:
          type: string
          format: date-time
        key:
          type: string
          readOnly: true
          description: The full key, returned once when the key is created. Only its hash is stored.
      required:
      - name
      - permissions
    ApiKeyPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
