        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
      x-permission: settings:read
    patch:
      tags:
      - Entities
      operationId: updateMember
      summary: Update member
      description: JSON merge patch (RFC 7396). Read-only fields are ignored.
      parameters:
      - $ref: '#/components/parameters/EntityId'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Member'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
      x-permission: settings:write
    delete:
      tags:
      - Entities
      operationId: deleteMember
      summary: Delete member
      description: Revokes access; history keeps the person's name.
      parameters:
      - $ref: '#/components/parameters/EntityId'
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
