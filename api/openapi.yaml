        taxable, cgst, sgst, igst, total, tds?, outstanding?, due_date?. Dry run is the default and returns every problem
        by row; a real import is all or nothing (422 `import_rejected`). Invoices and bills are records of the position on
        the cut-off date: nothing is e-invoiced, filed or posted to the ledger, and bills are marked as already claimed in
