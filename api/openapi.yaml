components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `/auth/token` or the OIDC/SAML login. 15-minute lifetime; refresh with the refresh token.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Server-to-server keys, scoped to one entity and a list of permissions (Settings › API keys).
  parameters:
    EntityId:
      name: entityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Legal entity the call acts on
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from `next_cursor`
    Sort:
      name: sort
      in: query
      schema:
        type: string
        examples:
        - -due_date
      description: Field name; prefix `-` for descending
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Unique per logical operation. Replays within 24 h return the first response.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: ETag from the last GET; stale writes get 412
    From:
      name: from
      in: query
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      schema:
        type: string
        format: date
    Q:
      name: q
      in: query
      schema:
        type: string
      description: Free-text search
  headers:
    ETag:
      schema:
        type: string
      description: Version of the resource for If-Match
    RateLimit:
      schema:
        type: string
      description: 'IETF RateLimit header: `limit=600, remaining=598, reset=42`'
  responses:
    BadRequest:
      description: Validation failed (`validation_failed`, `b2b_needs_gstin`, `tax_split_mismatch` …)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or expired token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Caller can see the entity but lacks the permission (`permission_denied`, `two_person_rule`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or is not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict (`conflict`, `period_locked`, `over_settlement`, `idempotency_conflict`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match did not match the current ETag
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooMany:
      description: Rate limit exceeded; see Retry-After
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Money:
      type: string
      pattern: ^-?[0-9]{1,16}\.[0-9]{2}$
      examples:
      - '472000.00'
      description: INR, two decimals, as a string
    Gstin:
      type: string
      pattern: ^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$
      examples:
      - 29AAHCN1234Q1Z8
    Pan:
      type: string
      pattern: ^[A-Z]{5}[0-9]{4}[A-Z]$
      examples:
      - AAHCN1234Q
    StateCode:
      type: string
      pattern: ^[0-9]{2}$
      examples:
      - '29'
      description: GST state code
    HsnSac:
      type: string
      pattern: ^[0-9]{4,8}$
      examples:
      - '902620'
    FyLabel:
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}$
      examples:
      - 2026-27
    FieldError:
      type: object
      properties:
        field:
          type: string
          examples:
          - lines[2].hsn_sac
        message:
          type: string
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          examples:
          - https://docs.[YOUR DOMAIN]/errors/tax_split_mismatch
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
          - validation_failed
          - not_found
          - conflict
          - precondition_failed
          - idempotency_conflict
          - two_person_rule
          - permission_denied
          - period_locked
          - journal_unbalanced
          - tax_split_mismatch
          - b2b_needs_gstin
          - note_needs_original
          - number_too_long
          - over_settlement
          - msme_terms_exceeded
          - rule_version_overlap
          - portal_session_expired
          - portal_rejected
          - approval_required
          - rate_limited
          - unauthorized
          - mfa_required
          - internal
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        request_id:
          type: string
      required:
      - type
      - title
      - status
      - code
      description: RFC 9457 problem details. `code` is stable; `title`/`detail` are for humans.
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          type: string
          examples:
          - gst.file_gstr1
        status:
          type: string
          enum:
          - queued
          - running
          - waiting_for_otp
          - succeeded
          - failed
          - cancelled
        progress:
          type: number
          minimum: 0
          maximum: 1
        subject:
          type: string
          examples:
          - gst_returns
        subject_id:
          type: string
          format: uuid
        result:
          type: object
          description: e.g. {"arn":"AA2910260012345"}
        error:
          $ref: '#/components/schemas/Problem'
        created_at:
          type: string
          format: date-time
          readOnly: true
        finished_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - id
      - kind
      - status
      description: Long-running operation, usually a government-portal call
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          examples:
          - 900
      required:
      - access_token
      - token_type
      - expires_in
    OtpRequest:
      type: object
      properties:
        mobile_e164:
          type: string
        email:
          type: string
          format: email
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
      required:
      - email
      - full_name
    TokenRequest:
      type: object
      properties:
        grant_type:
          type: string
          enum:
          - password
          - otp
          - refresh_token
          - authorization_code
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        mobile_e164:
          type: string
        otp:
          type: string
          pattern: ^[0-9]{6}$
        refresh_token:
          type: string
        code:
          type: string
        redirect_uri:
          type: string
          format: uri
        mfa_code:
          type: string
      required:
      - grant_type
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
    EntitySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
