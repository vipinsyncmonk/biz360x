name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biz360x
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/biz360x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Load schema
        run: for f in db/[0-9][0-9]_*.sql; do psql -d biz360x -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Database behaviour checks
        run: psql -d biz360x -v ON_ERROR_STOP=1 -q -f db/tests/demo_and_checks.sql
      - name: Install API dependencies
        run: pip install -r server/requirements.txt pyyaml openapi-spec-validator pip-audit
      - name: Dependency vulnerability scan
        run: pip-audit -r server/requirements.txt
      - name: Contract is generated, valid and linted
        run: |
          python api/build_openapi.py /tmp/openapi.yaml
          diff -u api/openapi.yaml /tmp/openapi.yaml
          python -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('api/openapi.yaml')))"
          npx -y @redocly/cli@1.25.0 lint api/openapi.yaml --config api/redocly.yaml
      - name: Docs map references real operations
        run: python scripts/check_docs_map.py
      - name: End-to-end API tests
        working-directory: server
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Generated API types are current
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npx next build
      - name: Dependency vulnerability scan
        run: npm audit --omit=dev

  e2e:
    # Real browser tests against the real stack: PostgreSQL with the demo data, the API, the worker and the built web app.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biz360x
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: server/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -r server/requirements.txt
      - name: Reset the database, start the API and the worker
        run: E2E_PYTHON="$(which python)" bash scripts/e2e-stack.sh start
      - name: Build and start the web app
        working-directory: web
        run: |
          npm ci
          npx next build
          nohup npx next start -p 3000 > ../var/e2e-web.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:3000/login >/dev/null && exit 0; sleep 1; done
          echo "web app did not start"; cat ../var/e2e-web.log; exit 1
      - name: Install the browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: web
        run: npx playwright test
      - name: Keep the report and server logs when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            web/playwright-report
            web/test-results
            var/e2e-*.log
          if-no-files-found: ignore
          retention-days: 7
