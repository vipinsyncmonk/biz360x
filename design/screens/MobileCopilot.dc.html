<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Biz360X — Mobile Copilot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0}
a{color:#2846E0}a:hover{color:#1A31A8}
.disp{font-family:"Bricolage Grotesque","Geist",ui-sans-serif,system-ui,sans-serif;letter-spacing:-0.02em}
.mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3EE; color: #14161A; font-family: Geist, ui-sans-serif, system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="flex: none; padding: 56px 18px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #E2E1DA; background: #F4F3EE">
    <span style="width: 36px; height: 36px; border-radius: 10px; background: #E8ECFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A31A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"></path></svg></span>
    <div style="flex: 1; display: flex; flex-direction: column"><h1 class="disp" style="margin: 0; font-size: 22px; font-weight: 700">Copilot</h1><span style="font-size: 12px; color: #5A5F68">Nimbus Instruments · reads books, GST, MCA</span></div>
    <button type="button" aria-label="New conversation" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DCDBD3; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14161A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </header>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px">
    <div style="align-self: flex-end; max-width: 85%; background: #14161A; color: #FFFFFF; padding: 12px 14px; border-radius: 16px 16px 4px 16px; font-size: 15px; line-height: 1.45">How much GST do we pay in cash for October?</div>
    <div style="max-width: 92%; background: #FFFFFF; border: 1px solid #E2E1DA; padding: 12px 14px; border-radius: 16px 16px 16px 4px; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; gap: 10px">
      <span>About <strong>₹4.68 L</strong> across 3 GSTINs. It drops to <strong>₹2.82 L</strong> if 4 suppliers file GSTR-1 by 11 Nov.</span>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <span class="mono" style="font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #E8ECFF; color: #1A31A8">Sales register</span>
        <span class="mono" style="font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #E8ECFF; color: #1A31A8">GSTR-2A</span>
      </div>
      <a href="Copilot.dc.html" style="font-size: 14px; font-weight: 500">See the breakdown</a>
    </div>

    <sc-if value="{{asked}}" hint-placeholder-val="{{ false }}">
      <div style="align-self: flex-end; max-width: 85%; background: #14161A; color: #FFFFFF; padding: 12px 14px; border-radius: 16px 16px 4px 16px; font-size: 15px; line-height: 1.45">{{q}}</div>
      <div style="max-width: 92%; background: #FFFFFF; border: 1px solid #E2E1DA; padding: 12px 14px; border-radius: 16px 16px 16px 4px; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; gap: 10px">
        <span>{{a}}</span>
        <span class="mono" style="align-self: flex-start; font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #E8ECFF; color: #1A31A8">{{src}}</span>
        <sc-if value="{{hasAction}}" hint-placeholder-val="{{ true }}">
          <button type="button" style="font: inherit; font-size: 14px; font-weight: 500; height: 44px; border-radius: 12px; border: 0; background: #14161A; color: #FFFFFF; cursor: pointer">{{action}}</button>
        </sc-if>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
      <span class="mono" style="font-size: 11px; color: #5A5F68">TRY ASKING</span>
      <sc-for list="{{prompts}}" as="p" hint-placeholder-count="3">
        <button type="button" onClick="{{p.pick}}" style="font: inherit; text-align: left; font-size: 14px; min-height: 44px; padding: 10px 14px; border-radius: 12px; border: 1px solid #DCDBD3; background: #FFFFFF; color: #14161A; cursor: pointer">{{p.t}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex: none; padding: 10px 14px; border-top: 1px solid #E2E1DA; background: #F4F3EE">
    <label for="mq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ask Copilot</label>
    <div style="display: flex; gap: 8px; align-items: center; background: #FFFFFF; border: 1px solid #C9C8C0; border-radius: 14px; padding: 4px 4px 4px 14px">
      <input id="mq" type="text" placeholder="Ask about your company" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 15px; background: transparent; color: #14161A; height: 40px">
      <button type="button" aria-label="Send" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: #2846E0; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
    </div>
  </div>

  <nav aria-label="Main" style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E2E1DA; padding: 6px 6px 28px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="{{t.href}}" aria-current="{{t.cur}}" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; font-size: 11px; font-weight: 500; {{t.st}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>{{t.t}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: null }; }
  renderVals() {
    const qa = [
      { t: 'Do we need a tax audit this year?', a: 'Not yet. Turnover is tracking at ₹8.9 Cr against the ₹10 Cr limit that applies while cash stays under 5% of receipts and payments. At the current run-rate you cross it around February.', src: 'Sec 44AB · sales ledger', action: 'Alert me at ₹9.5 Cr' },
      { t: 'Who hasn’t paid us in 60 days?', a: '3 customers owe ₹4.1 L past 60 days. Deccan Motors is the largest at ₹2.2 L, 88 days old.', src: 'Receivables ageing', action: 'Send reminders' },
      { t: 'When is our next board meeting due?', a: 'By 27 Jan at the latest — the gap between meetings can’t exceed 120 days, and the last one was 29 Sep. Nothing scheduled yet.', src: 'Board register · Sec 173', action: 'Propose dates' }
    ];
    const cur = this.state.pick === null ? null : qa[this.state.pick];
    const tabsDef = [
      ['Today', 'M3 12l9-8 9 8M5 10v10h14V10', 'MobileToday.dc.html'],
      ['Compliance', 'M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6zM9 12l2 2 4-4', 'MobileCompliance.dc.html'],
      ['Copilot', 'M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z', 'MobileCopilot.dc.html'],
      ['More', 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z', 'MobileMore.dc.html']
    ];
    return {
      asked: !!cur, q: cur ? cur.t : '', a: cur ? cur.a : '', src: cur ? cur.src : '', hasAction: !!cur, action: cur ? cur.action : '',
      prompts: qa.map((p, i) => ({ t: p.t, pick: () => this.setState({ pick: i }) })).filter((p, i) => i !== this.state.pick),
      tabs: tabsDef.map(([t, icon, href], i) => ({ t, icon, href, cur: i === 2 ? 'page' : 'false', st: i === 2 ? 'color:#14161A' : 'color:#5A5F68' }))
    };
  }
}
</script>
</body>
</html>
