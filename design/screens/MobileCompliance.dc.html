<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Biz360X — Mobile Compliance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0}
a{color:#2846E0}a:hover{color:#1A31A8}
.disp{font-family:"Bricolage Grotesque","Geist",ui-sans-serif,system-ui,sans-serif;letter-spacing:-0.02em}
.mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3EE; color: #14161A; font-family: Geist, ui-sans-serif, system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 56px 18px 20px; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; justify-content: space-between; align-items: center; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span class="mono" style="font-size: 11px; color: #5A5F68">NIMBUS INSTRUMENTS · FY 26–27</span>
        <h1 class="disp" style="margin: 0; font-size: 30px; font-weight: 700">Compliance</h1>
      </div>
      <button type="button" aria-label="Filter" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DCDBD3; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14161A" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button>
    </header>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="background: #FFFFFF; border: 1px solid #E2E1DA; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
          <span class="disp" style="font-size: 24px; font-weight: 700; line-height: 1; {{s.c}}">{{s.v}}</span>
          <span style="font-size: 12px; color: #5A5F68">{{s.l}}</span>
        </div>
      </sc-for>
    </div>

    <div role="tablist" aria-label="View" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E9E8E1; border-radius: 12px">
      <sc-for list="{{segs}}" as="g" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{g.on}}" onClick="{{g.pick}}" style="font: inherit; font-size: 14px; font-weight: 500; height: 40px; border: 0; border-radius: 9px; cursor: pointer; {{g.st}}">{{g.t}}</button>
      </sc-for>
    </div>

    <sc-for list="{{groups}}" as="w" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <span class="mono" style="font-size: 11px; color: #5A5F68; padding: 0 4px">{{w.h}}</span>
        <sc-for list="{{w.items}}" as="i" hint-placeholder-count="3">
          <div style="background: #FFFFFF; border: 1px solid #E2E1DA; border-radius: 16px; overflow: hidden">
            <button type="button" aria-expanded="{{i.open}}" onClick="{{i.toggle}}" style="font: inherit; width: 100%; text-align: left; border: 0; background: transparent; padding: 14px; min-height: 64px; cursor: pointer; display: flex; gap: 12px; align-items: center; color: #14161A">
              <span class="mono" style="width: 40px; flex: none; display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #5A5F68"><span style="font-size: 17px; font-weight: 600; color: #14161A">{{i.dd}}</span>{{i.mm}}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; line-height: 1.3">{{i.t}}</span><span style="font-size: 12px; color: #5A5F68">{{i.a}}</span></span>
              <span style="font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 999px; white-space: nowrap; {{i.ps}}">{{i.s}}</span>
            </button>
            <sc-if value="{{i.open}}" hint-placeholder-val="{{ false }}">
              <div style="padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px">
                <div style="background: #F4F3EE; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
                  <span class="mono" style="font-size: 10px; color: #5A5F68">WHY THIS APPLIES</span>
                  <span style="font-size: 13px; line-height: 1.5">{{i.why}}</span>
                  <span style="font-size: 13px; line-height: 1.5; color: #9A4508">{{i.late}}</span>
                </div>
                <sc-if value="{{i.hasCta}}" hint-placeholder-val="{{ true }}">
                  <button type="button" style="font: inherit; font-size: 14px; font-weight: 500; height: 44px; border-radius: 12px; border: 0; background: #14161A; color: #FFFFFF; cursor: pointer">{{i.cta}}</button>
                </sc-if>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </section>
    </sc-for>
  </div>

  <!-- tab bar -->
  <nav aria-label="Main" style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E2E1DA; padding: 6px 6px 28px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="{{t.href}}" aria-current="{{t.cur}}" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; font-size: 11px; font-weight: 500; {{t.st}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>{{t.t}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { seg: 'Upcoming', open: 'aoc' }; }
  renderVals() {
    const P = { due: 'background:#FDF0E1;color:#9A4508', ok: 'background:#E6F4EA;color:#14692F', wait: 'background:#E8ECFF;color:#1A31A8', prep: 'background:#EFEEE8;color:#3D424B' };
    const data = {
      Upcoming: [
        { h: 'THIS WEEK', items: [
          { id: 'aoc', dd: '30', mm: 'OCT', t: 'AOC-4 · Financial statements', a: 'MCA', s: 'Sign', ps: P.due, why: 'Private limited company · AGM held 30 Sep · due within 30 days.', late: 'If late: ₹100 per day additional fee.', cta: 'Review & sign with DSC' },
          { id: 'tds', dd: '31', mm: 'OCT', t: 'TDS return · Q2', a: 'Income Tax · 24Q, 26Q', s: 'Approve', ps: P.due, why: 'TAN registered · deductions on salary and contractors in Jul–Sep.', late: 'If late: ₹200 per day under Sec 234E.', cta: 'Approve return' }
        ] },
        { h: 'NEXT 30 DAYS', items: [
          { id: 'dep', dd: '07', mm: 'NOV', t: 'TDS deposit · October', a: 'Income Tax · Challan 281', s: 'Scheduled', ps: P.wait, why: '₹2.94 L deducted in October under 192, 194C and 194J.', late: 'If late: 1.5% interest per month or part.', cta: '' },
          { id: 'r1', dd: '11', mm: 'NOV', t: 'GSTR-1 · October', a: 'GSTN · 3 GSTINs', s: 'Ready', ps: P.wait, why: 'Monthly filer · 212 invoices drafted from the sales register.', late: 'If late: daily late fee per GSTIN.', cta: 'Review draft' },
          { id: 'pf', dd: '15', mm: 'NOV', t: 'PF ECR and ESI', a: 'EPFO · ESIC', s: 'Scheduled', ps: P.wait, why: '38 employees · EPF applies at 20+, ESI at 10+.', late: 'If late: damages and interest on the contribution.', cta: '' },
          { id: 'mgt', dd: '29', mm: 'NOV', t: 'MGT-7 · Annual return', a: 'MCA', s: 'Assign', ps: P.due, why: 'Within 60 days of the AGM held 30 Sep.', late: 'If late: ₹100 per day additional fee.', cta: 'Assign a CS' }
        ] }
      ],
      Filed: [
        { h: 'OCTOBER', items: [
          { id: 'm1', dd: '27', mm: 'OCT', t: 'MSME-1 · Apr–Sep', a: 'MCA · SRN stored', s: 'Filed', ps: P.ok, why: 'Dues to micro and small suppliers beyond 45 days.', late: '', cta: '' },
          { id: 'b3', dd: '18', mm: 'OCT', t: 'GSTR-3B · September', a: 'GSTN · 3 GSTINs', s: 'Filed', ps: P.ok, why: 'Monthly filer · ₹4.21 L paid in cash.', late: '', cta: '' },
          { id: 'ecr', dd: '13', mm: 'OCT', t: 'PF ECR · September', a: 'EPFO', s: 'Filed', ps: P.ok, why: '38 members · challan paid.', late: '', cta: '' }
        ] }
      ],
      Notices: [
        { h: 'OPEN', items: [
          { id: 'asmt', dd: '14', mm: 'NOV', t: 'ASMT-10 · FY 2023–24', a: 'GST · Karnataka', s: 'Reply', ps: P.due, why: 'Scrutiny of ITC claimed vs GSTR-2A. 31 of 34 flagged invoices already matched.', late: 'Reply due 14 Nov.', cta: 'Review draft reply' },
          { id: 'int', dd: '21', mm: 'OCT', t: '143(1) intimation', a: 'Income Tax · AY 2025–26', s: 'Info', ps: P.prep, why: 'Return processed. Refund of ₹42,180 adjusted against an earlier demand.', late: '', cta: '' }
        ] }
      ]
    };
    const seg = this.state.seg;
    const segOn = 'background:#FFFFFF;color:#14161A;box-shadow:0 1px 2px rgba(20,22,26,0.12)';
    const tabsDef = [
      ['Today', 'M3 12l9-8 9 8M5 10v10h14V10', 'MobileToday.dc.html'],
      ['Compliance', 'M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6zM9 12l2 2 4-4', 'MobileCompliance.dc.html'],
      ['Copilot', 'M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z', 'MobileCopilot.dc.html'],
      ['More', 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z', 'MobileMore.dc.html']
    ];
    return {
      stats: [{ v: '61', l: 'Filed', c: 'color:#14692F' }, { v: '14', l: 'Next 30 days', c: '' }, { v: '3', l: 'Need you', c: 'color:#9A4508' }],
      segs: ['Upcoming', 'Filed', 'Notices'].map((t) => ({ t, on: seg === t, st: seg === t ? segOn : 'background:transparent;color:#3D424B', pick: () => this.setState({ seg: t, open: null }) })),
      groups: data[seg].map((g) => ({ h: g.h, items: g.items.map((i) => ({ ...i, open: this.state.open === i.id, hasCta: !!i.cta,
        toggle: () => this.setState({ open: this.state.open === i.id ? null : i.id }) })) })),
      tabs: tabsDef.map(([t, icon, href], i) => ({ t, icon, href, cur: i === 1 ? 'page' : 'false', st: i === 1 ? 'color:#14161A' : 'color:#5A5F68' }))
    };
  }
}
</script>
</body>
</html>
